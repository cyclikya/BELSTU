[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textsteg"
version = "0.1.0"
description = "Метод на основе совместного применения перемежения и помехоустойчивого кодирования в текстовой стеганографии"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Графический интерфейс (этап «Разработка программного средства»).
gui = [
    "PySide6>=6.10",
]
# Экспериментальные исследования и построение графиков (этап «Тестирование
# приложения, экспериментальные исследования и анализ результатов»).
research = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
textsteg = "textsteg.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
# Графический интерфейс исключён из строгой проверки: поставляемые
# с PySide6 заглушки типов неполны, и строгий режим даёт ложные
# замечания на штатном использовании Qt.
exclude = ["src/textsteg/gui/"]
