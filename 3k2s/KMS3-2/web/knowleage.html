<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Диалог с базой знаний</title>

<script src="resources/js/knowleage_kamaz.js"></script>
<script>

function getEnding(word)
{
  for (var i = 0; i < endings.length; i++)
  {
    if (word.substring(word.length - endings[i][0].length) == endings[i][0])
    {
      return endings[i][1];
    }
  }
  return "";
}

function small1(str)
{
  return str.substring(0, 1).toLowerCase() + str.substring(1);
}

function big1(str)
{
  return str.substring(0, 1).toUpperCase() + str.substring(1);
}

function getAnswer(question)
{
  question = small1(question);

  question = question.replace("?", " ?");
  question = question.replace(".", " .");
  question = question.replace(",", " ,");
  question = question.replace("!", " !");

  var words = question.split(" ");

  var result = false;
  var answer = "";

  for (var i = 0; i < words.length; i++)
  {
    var ending = getEnding(words[i]);

    if (ending != "")
    {
      var predicate = new RegExp(words[i].substring(0, words[i].length - 2) + ending);

      var predicate2 = predicate;

      if (i + 1 < words.length)
      {
        predicate2 = new RegExp(words[i] + " " + words[i + 1]);
      }

      var subject_string = words.slice(0, i).join(".*");
      var subject = new RegExp(".*" + subject_string + ".*");

      for (var j = 0; j < knowleage.length; j++)
      {
        if ((predicate.test(knowleage[j][1]) || predicate2.test(knowleage[j][1])) &&
            (subject.test(knowleage[j][0].toLowerCase()) || subject.test(knowleage[j][2].toLowerCase())))
        {
          answer = big1(knowleage[j][0]) + " " + knowleage[j][1] + " " + knowleage[j][2] + ".";
          result = true;
          break;
        }
      }
    }

    if (result == true)
    {
      break;
    }
  }

  if (result == false)
  {
    var subject_all = new RegExp(".*" + words.join(".*") + ".*");

    for (var j = 0; j < knowleage.length; j++)
    {
      if (subject_all.test(knowleage[j][0].toLowerCase()))
      {
        answer = big1(knowleage[j][0]) + " " + knowleage[j][1] + " " + knowleage[j][2] + ".";
        result = true;
        break;
      }
    }
  }

  if (result == false)
  {
    answer = "Ответ не найден";
  }

  return answer;
}

for (var i = 1; i <= knowleage.length; i++)
{
  if (confirm("Продолжить диалог?"))
  {
    var question = prompt("Введите вопрос", "");
    alert(getAnswer(question));
  }
  else
  {
    break;
  }
}
</script>
</head>

<body>
</body>
</html>
