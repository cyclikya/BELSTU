<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        #nameDisplay {
            font-size: 20px;
            color: #28a745;
            text-align: center;
            padding: 20px;
            border: 2px solid #28a745;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fetch API Demo</h1>
        <div id="nameDisplay">Загрузка...</div>
    </div>

    <script>
        fetch('http://localhost:5000/api/name')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nameDisplay').textContent = data;
            })
            .catch(error => {
                document.getElementById('nameDisplay').textContent = 'Ошибка загрузки';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
