<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Ajax</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        #nameDisplay {
            font-size: 20px;
            color: #dc3545;
            text-align: center;
            padding: 20px;
            border: 2px solid #dc3545;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>jQuery Ajax Demo</h1>
        <div id="nameDisplay">Загрузка...</div>
    </div>

    <script>
        $(document).ready(function() {
            $.ajax({
                url: 'http://localhost:5000/api/name',
                method: 'GET',
                success: function(data) {
                    $('#nameDisplay').text(data);
                },
                error: function() {
                    $('#nameDisplay').text('Ошибка загрузки');
                }
            });
        });
    </script>
</body>
</html>
