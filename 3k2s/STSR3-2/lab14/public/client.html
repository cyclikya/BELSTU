<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Кафедры</title>

    <style>
        body {
            font-family: Verdana, Arial, sans-serif;
            margin: 0;
            background: #eef2f7;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px;
            text-align: center;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .block {
            background: white;
            border: 1px solid #d1d5db;
            padding: 18px;
            margin-bottom: 20px;
        }

        h1,
        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid #9ca3af;
            font-size: 14px;
        }

        .buttons {
            margin-top: 15px;
        }

        button {
            padding: 9px 14px;
            margin-right: 8px;
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .clear {
            background: #6b7280;
        }

        .clear:hover {
            background: #4b5563;
        }

        .delete {
            background: #dc2626;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .edit {
            background: #16a34a;
        }

        .edit:hover {
            background: #15803d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #374151;
            color: white;
        }

        th,
        td {
            border: 1px solid #d1d5db;
            padding: 8px;
            text-align: left;
        }

        .message {
            margin-top: 12px;
            padding: 10px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>

    <header>
        <h1>Кафедры</h1>
    </header>

    <main>
        <div class="block">
            <h2>Добавление и изменение кафедры</h2>

            <label for="pulpit">Код кафедры</label>
            <input type="text" id="pulpit" placeholder="Например: TEST">

            <label for="pulpit_name">Название кафедры</label>
            <input type="text" id="pulpit_name" placeholder="Например: Тестовая кафедра">

            <label for="faculty">Факультет</label>
            <select id="faculty">
                <option value="">Загрузка факультетов...</option>
            </select>

            <div class="buttons">
                <button onclick="createPulpit()">Добавить</button>
                <button onclick="updatePulpit()">Изменить</button>
                <button class="clear" onclick="clearForm()">Очистить</button>
            </div>

            <div id="successMessage" class="message success"></div>
            <div id="errorMessage" class="message error"></div>
        </div>

        <div class="block">
            <h2>Список кафедр</h2>
            <button onclick="loadPulpits()">Обновить список</button>

            <div id="pulpitsList" style="margin-top: 15px;"></div>
        </div>
    </main>

    <script>
        const PULPITS_API = '/api/pulpits';
        const FACULTIES_API = '/api/faculties';

        document.addEventListener('DOMContentLoaded', () => {
            loadFaculties();
            loadPulpits();
        });

        function showSuccess(text) {
            const div = document.getElementById('successMessage');
            div.textContent = text;
            div.style.display = 'block';

            setTimeout(() => {
                div.style.display = 'none';
            }, 3000);
        }

        function showError(text) {
            const div = document.getElementById('errorMessage');
            div.textContent = text;
            div.style.display = 'block';

            setTimeout(() => {
                div.style.display = 'none';
            }, 5000);
        }

        async function loadFaculties() {
            const select = document.getElementById('faculty');

            try {
                const response = await fetch(FACULTIES_API);

                if (!response.ok) {
                    throw new Error('Не удалось загрузить факультеты');
                }

                const faculties = await response.json();

                select.innerHTML = '<option value="">Выберите факультет</option>';

                faculties.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.faculty;
                    option.textContent = item.faculty + ' - ' + item.faculty_name;
                    select.appendChild(option);
                });
            } catch (error) {
                select.innerHTML = '<option value="">Ошибка загрузки факультетов</option>';
                showError(error.message);
            }
        }

        async function loadPulpits() {
            try {
                const response = await fetch(PULPITS_API);

                if (!response.ok) {
                    throw new Error('Не удалось загрузить кафедры');
                }

                const pulpits = await response.json();
                showPulpits(pulpits);
            } catch (error) {
                showError(error.message);
            }
        }

        function showPulpits(pulpits) {
            const list = document.getElementById('pulpitsList');

            if (!pulpits.length) {
                list.innerHTML = '<p>Кафедр пока нет</p>';
                return;
            }

            let html = `
                <table>
                    <tr>
                        <th>Код кафедры</th>
                        <th>Название</th>
                        <th>Факультет</th>
                        <th>Действия</th>
                    </tr>
            `;

            pulpits.forEach(item => {
                html += `
                    <tr>
                        <td>${escapeHtml(item.pulpit)}</td>
                        <td>${escapeHtml(item.pulpit_name)}</td>
                        <td>${escapeHtml(item.faculty)}</td>
                        <td>
                            <button class="edit" onclick='editPulpit(${JSON.stringify(item)})'>Редактировать</button>
                            <button class="delete" onclick="deletePulpit('${item.pulpit}')">Удалить</button>
                        </td>
                    </tr>
                `;
            });

            html += '</table>';
            list.innerHTML = html;
        }

        async function createPulpit() {
            const data = getFormData();

            if (!data) {
                return;
            }

            try {
                const response = await fetch(PULPITS_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message);
                }

                showSuccess('Кафедра добавлена');
                clearForm();
                loadPulpits();
            } catch (error) {
                showError('Ошибка добавления: ' + error.message);
            }
        }

        async function updatePulpit() {
            const data = getFormData();

            if (!data) {
                return;
            }

            try {
                const response = await fetch(PULPITS_API, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message);
                }

                showSuccess('Кафедра изменена');
                clearForm();
                loadPulpits();
            } catch (error) {
                showError('Ошибка изменения: ' + error.message);
            }
        }

        async function deletePulpit(id) {
            const pulpitId = String(id).trim();

            const answer = confirm('Удалить кафедру ' + pulpitId + '?');

            if (!answer) {
                return;
            }

            try {
                const response = await fetch(PULPITS_API + '/' + encodeURIComponent(pulpitId), {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (!response.ok || result.code) {
                    throw new Error(result.message || 'Ошибка удаления');
                }

                showSuccess('Кафедра удалена');
                loadPulpits();
            } catch (error) {
                showError('Ошибка удаления: ' + error.message);
            }
        }

        function editPulpit(item) {
            document.getElementById('pulpit').value = item.pulpit;
            document.getElementById('pulpit_name').value = item.pulpit_name;
            document.getElementById('faculty').value = item.faculty;

            document.getElementById('pulpit').disabled = true;
            window.scrollTo(0, 0);
        }

        function clearForm() {
            document.getElementById('pulpit').value = '';
            document.getElementById('pulpit_name').value = '';
            document.getElementById('faculty').value = '';
            document.getElementById('pulpit').disabled = false;
        }

        function getFormData() {
            const pulpit = document.getElementById('pulpit').value.trim();
            const pulpit_name = document.getElementById('pulpit_name').value.trim();
            const faculty = document.getElementById('faculty').value;

            if (!pulpit || !pulpit_name || !faculty) {
                showError('Заполните все поля');
                return null;
            }

            return {
                pulpit: pulpit,
                pulpit_name: pulpit_name,
                faculty: faculty
            };
        }

        function escapeHtml(value) {
            if (!value) {
                return '';
            }

            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }
    </script>

</body>

</html>
